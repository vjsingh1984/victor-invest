[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "victor-invest"
version = "0.7.0"
description = "AI-powered investment analysis platform combining SEC fundamentals, technical indicators, and multi-model valuation synthesis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Vijaykumar Singh", email = "vijay@anvaiops.com"}
]
maintainers = [
    {name = "Vijaykumar Singh", email = "vijay@anvaiops.com"}
]
keywords = [
    "investment",
    "research",
    "sec",
    "financial-analysis",
    "llm",
    "valuation",
    "fundamental-analysis",
    "technical-analysis",
    "ai",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Victor SDK definition contract
    "victor-contracts>=0.7.0,<1.0",

    # Core dependencies
    "requests>=2.32.0,<2.35",
    "pandas>=2.0.0,<4",
    "numpy>=1.24.0,<2.5",
    "scipy>=1.11.0,<2",
    "networkx>=3.0,<4",
    "sqlalchemy>=2.0.0,<3",
    "psycopg2-binary>=2.9.0,<3",
    "aiohttp>=3.9.0,<4",

    # API Framework
    "fastapi>=0.104.0,<1.0",
    "uvicorn[standard]>=0.24.0,<1.0",
    "pydantic>=2.4.0,<3",
    "python-multipart>=0.0.6,<1.0",

    # Yahoo Finance API
    "yfinance>=0.2.0,<2",
    "peewee>=3.14,<5",  # yfinance dependency; keep semgrep-compatible in shared env

    # XML parsing
    "lxml>=4.9.0,<7",

    # JSON handling
    "ujson>=5.8.0,<6",
    "orjson>=3.9.0,<4",

    # Data processing
    "pyarrow>=13.0.0,<26",

    # PDF generation
    "reportlab>=4.0.0,<6",
    "markdown>=3.5.0,<4",

    # Email functionality
    "secure-smtplib>=0.1.1,<1.0",
    "aiosmtplib>=3.0.0,<6",

    # Progress bars and CLI
    "tqdm>=4.66.0,<5",
    "click>=8.3.2,<9",
    "rich>=13.6.0,<16",

    # Date/time handling
    "python-dateutil>=2.8.0,<3",
    "pendulum>=2.1.0,<4",

    # Caching
    "diskcache>=5.6.3,<6",
    "redis[hiredis]>=7.4.0,<9",
    "aiocache>=0.12.0,<1.0",

    # Configuration
    "pyyaml>=6.0.0,<7",
    "python-dotenv>=1.0.0,<2",

    # Database
    "alembic>=1.12.0,<2",
    "asyncpg>=0.31.0,<1.0",

    # Message Queue
    "celery>=5.3.0,<6",
    "kombu>=5.6.2,<6",

    # Monitoring
    "prometheus-client>=0.18.0,<1.0",
    "opentelemetry-api>=1.39.1,<1.45",
    "opentelemetry-sdk>=1.39.1,<1.45",
    "opentelemetry-instrumentation-fastapi>=0.62b0,<0.66",
    "psutil>=5.9.0,<8",

    # Vector Database
    "qdrant-client>=1.6.0,<2",

    # WebSocket
    "websockets>=12.0.0,<18",
    "python-socketio>=5.10.0,<6",

    # Security
    "cryptography>=41.0.0,<51",
    "python-jose[cryptography]>=3.3.0,<4",
    "passlib[bcrypt]>=1.7.4,<2",

    # Data Validation
    "marshmallow>=3.20.0,<5",
    "cerberus>=1.3.8,<2",

    # Logging
    "structlog>=23.2.0,<27",
    "loguru>=0.7.0,<1.0",
]

[project.optional-dependencies]
runtime = [
    "victor-ai>=0.7.0,<1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "coverage>=7.13.5",
    # Lint/type toolchain carries upper bounds: these gate CI, and a new major
    # (or, for Ruff, a new minor) changes what is enforced. Bump deliberately.
    "isort>=8.0.1,<10",
    "mypy>=1.5.0,<3",
    "flake8>=6.1.0,<8",
    # Ruff 0.x treats minor bumps as breaking: 0.16 widened the default rule
    # set and can change formatter output. Lint rules are pinned explicitly in
    # [tool.ruff.lint], but the formatter still follows the version.
    "ruff>=0.15,<0.17",
]
viz = [
    "matplotlib>=3.7.0",
    "plotly>=6.7.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[project.scripts]
# Main CLI entry point - pip installable, cross-platform
investigator = "investigator.cli:main"
# Alias for backwards compatibility
inv = "investigator.cli:main"
# Victor-powered CLI
victor-invest = "victor_invest.cli:main"
# Legacy CLI (deprecated - use 'investigator' instead)
investigator-legacy = "cli_orchestrator:cli"

# Plugin entry point (consolidated, SDK >= 0.7.0).
# All registration (tools, vertical, dependencies, safety) is handled inside
# InvestmentPlugin.register(context) so only this one entry point is needed.
[project.entry-points."victor.plugins"]
investment = "victor_invest.vertical:plugin"

# Sidecar entry points kept for backward compatibility with SDK < 0.7.0 hosts
# that scan these groups directly instead of calling plugin.register(context).
[project.entry-points."victor.tool_dependencies"]
invest = "victor_invest.tool_dependencies:get_provider"

[project.entry-points."victor.safety_rules"]
invest = "victor_invest.safety_enhanced:create_investment_safety_rules"

[project.entry-points."victor.prompt_contributors"]
invest = "victor_invest.prompts.contributor:InvestmentPromptContributor"

[project.entry-points."victor.workflow_providers"]
invest = "victor_invest.workflows:InvestmentWorkflowProvider"

[project.urls]
Homepage = "https://github.com/anvai-labs/victor-invest"
Documentation = "https://github.com/anvai-labs/victor-invest#readme"
Repository = "https://github.com/anvai-labs/victor-invest"
Issues = "https://github.com/anvai-labs/victor-invest/issues"
Changelog = "https://github.com/anvai-labs/victor-invest/releases"

[tool.setuptools]
package-dir = {"" = "src", "victor_invest" = "victor_invest"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["investigator*", "victor_invest*"]
exclude = ["tests*", "docs*"]

[tool.victor.contract_audit]
source_roots = ["victor_invest"]
exclude = [
    "victor_invest/api/**",
    "victor_invest/cli.py",
    "victor_invest/framework_bootstrap.py",
]

[tool.black]
line-length = 120
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | data
  | artifacts
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [".venv", "build", "dist", "data", "artifacts"]

[tool.ruff]
# Same line length as Black
line-length = 120

# Target Python versions
target-version = "py311"

# Exclude directories matching Black's extend-exclude
extend-exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "data",
    "artifacts",
]

[tool.ruff.lint]
# Pin the rule set explicitly rather than inheriting Ruff's built-in defaults.
# Ruff 0.16 widened those defaults, so an unpinned `ruff>=0.4.0` in the dev
# extras silently changed what CI enforced and broke the lint gate. These are
# the rules this repo has always been linted against (Ruff's pre-0.16 default).
# Adopting additional rule families is a deliberate, separate change.
#
# Rules are listed individually rather than by family: selecting a whole family
# pulls in rules whose findings have not been resolved, which would leave the
# gate red. Every rule below is at zero findings as of this commit.
#
# Deliberately NOT adopted, with reasons:
#   BLE001 (987)  broad `except Exception`. This is the documented tool contract
#                 in CLAUDE.md -- tools never raise, they return
#                 ToolResult.create_failure() -- so the rule argues against the
#                 architecture rather than against a defect.
#   DTZ*   (539)  naive datetime/date construction. Genuinely worth fixing in a
#                 point-in-time system, but every fix turns a naive datetime
#                 into an aware one, and mixing the two raises TypeError at
#                 runtime on comparison. That is a behavioural migration needing
#                 its own change and its own testing, not a lint sweep.
#   SIM102 (76)   collapsible `if`. Ruff declines to autofix exactly these -- the
#                 nested form carries interleaved comments -- so collapsing them
#                 by hand costs readability for no correctness gain.
#   I001          import sorting: isort is the authority in CI and the two
#                 disagree on a couple of blocks.
select = [
    # Ruff's pre-0.16 default set.
    "E4",
    "E7",
    "E9",
    "F",
    # Correctness.
    "ASYNC230", # blocking open() inside an async function
    "B023",     # closure over a loop variable
    "PLC0206",  # dict iteration without .items()
    "PLE",      # pylint errors
    "PLR0124",  # comparison with itself
    "PLW0127",  # self-assignment
    "PLW1510",  # subprocess.run without explicit check=
    "RUF012",   # mutable class attribute not marked ClassVar
    "RUF013",   # implicit Optional (`x: int = None`)
    "RUF034",   # useless if-else (identical branches)
    # flake8-bandit, whole family. Adopted after an audit showed only 10 of its 107
    # rules had findings in production code; those 10 are listed under `ignore`
    # below with the reason. Enabling the family rather than naming ~96 individual
    # rules means a newly-written insecure pattern is caught by default instead of
    # waiting for someone to notice the rule exists -- which is how a shell-built
    # subprocess pipeline (S602) survived until it was found by hand.
    "S",
    # Logging hygiene.
    "G201",   # .error(..., exc_info=True) instead of .exception()
    "LOG015", # logging on the root logger
    "TRY401", # exception object restated in .exception()
    # Modernisation and simplification.
    "C401",
    "C408",
    "EXE001",
    "FURB162",
    "FURB167",
    "PERF102",
    "PERF402",
    "PIE790",
    "PLC0414",
    "PLR1722",
    "PYI034",
    "RUF010",
    "RUF015",
    "RUF019",
    "RUF022",
    "RUF059",
    "SIM103",
    "SIM114",
    "SIM117",
    "SIM118",
    "SIM201",
    "UP006",
    "UP007",
    "UP017",
    "UP024",
    "UP035",
    "UP036",
    "UP037",
    "UP041",
    "UP045",
]


# flake8-bandit rules with outstanding findings in production code. Each is
# deferred with a reason rather than silently dropped; the count is what it was
# when the family was adopted, so growth is visible in review.
ignore = [
    # 44 -- SQL built with f-strings. The *values* are parameterised (":symbol");
    # what is interpolated are identifiers -- column and table names drawn from
    # fixed dicts -- which parameter binding cannot express. Real exposure would
    # need an attacker-controlled key reaching one of those lookups, so this wants
    # a focused per-site review rather than a sweep.
    "S608",
    # 8 -- fires on every subprocess call that correctly passes a list instead of a
    # shell string. It flags the safe form; the unsafe one is S602, which is on.
    "S603",
    # 7 -- pickle in the RL policy and parquet caches. Changing the serialisation
    # format is a stored-data migration, not a lint fix.
    "S301",
    # 6 -- credential_sanitizer and mcp_credentials define the *names* of keys to
    # redact ("PASSWORD", "SECRET", "TOKEN"). Flagging a redaction module for
    # naming the things it redacts is a false positive.
    "S105",
    # 5 -- binding 0.0.0.0 is deliberate for the API server in a container.
    "S104",
    # 5 -- the CLI shells out to pip, tail and grep by name on purpose; resolving
    # absolute paths would break it across platforms.
    "S607",
    # 2 -- xml.etree parsing of SEC filings. Hardening means depending on
    # defusedxml, which is a dependency decision.
    "S314",
    # 1 each -- a debug log under /tmp, a urlopen against a constructed Ollama URL,
    # and random.choice for LLM pool selection. None are security-relevant, but each
    # deserves a look rather than a blanket noqa.
    "S108",
    "S310",
    "S311",
]

[tool.ruff.lint.per-file-ignores]
# CLI entry points run one command and exit, so a blocking file read never
# starves a busy event loop. The library and workflow paths do observe
# ASYNC230 -- those call sites use asyncio.to_thread.
"src/investigator/cli/**" = ["ASYNC230"]
"src/investigator/interfaces/cli/**" = ["ASYNC230"]
"victor_invest/cli.py" = ["ASYNC230"]
# assert IS the mechanism in a test; S105/S106 fire on fixture credentials.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
# Use double quotes (Black default)
quote-style = "double"

# Use spaces for indentation (Black default)
indent-style = "space"

# Preserve magic trailing commas (Black style)
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
# Without mypy_path, mypy cannot resolve `investigator` at all -- an editable
# install uses PEP 660 import hooks it does not follow -- so every first-party
# import reported import-not-found. The blanket ignore_missing_imports below used
# to hide that, which meant unresolved modules silently became Any.
mypy_path = "src"
# src/ has no __init__.py, so with namespace packages enabled the same file is
# reachable as both investigator.X and src.investigator.X. Turning them off makes
# __init__.py authoritative for module names. Requires dropping
# --explicit-package-bases, which mypy rejects in combination.
namespace_packages = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Third-party packages that ship no stubs and no py.typed marker. Listing them
# individually keeps "we cannot type this" a recorded decision; a blanket setting
# hides missing first-party modules along with them.
[[tool.mypy.overrides]]
module = [
    "diskcache", "diskcache.*",
    "json_repair", "json_repair.*",
    "matplotlib", "matplotlib.*",
    "mplfinance", "mplfinance.*",
    "networkx", "networkx.*",
    "plotly", "plotly.*",
    "psutil", "psutil.*",
    "psycopg2", "psycopg2.*",
    "qdrant_client", "qdrant_client.*",
    "reportlab", "reportlab.*",
    "scipy", "scipy.*",
    "talib", "talib.*",
    "yfinance", "yfinance.*",
    # Repo-local, deliberately unpackaged: CLI subcommands wrap these scripts.
    "scripts.*",
    # The host runtime and its contracts ship no py.typed marker.
    "victor.*",
    "victor_contracts.*",
]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".mypy_cache",
    ".venv",
    "data",
    "artifacts"
]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "C0114", # Missing module docstring
    "C0115", # Missing class docstring
    "C0116", # Missing function or method docstring
    "R0903", # Too few public methods (often applies to simple data classes or agents)
    "R0913", # Too many arguments
    "W0613", # Unused argument
    "W1203", # Use % formatting in logging functions and pass data as arguments
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=investigator --cov=victor_invest --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "llm: marks tests that require LLM access",
    "db: marks tests that require database access",
]

[tool.coverage.run]
branch = true
source = ["investigator", "victor_invest"]
omit = [
    "tests/*",
    "artifacts/*",
    "data/*",
    "docs/*",
    "frontend/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
